<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Zaza-Dimli speaking regions map</title>
  <desc id="desc">A warm beige archival style map showing Zaza Kurdish cities and regions in eastern Anatolia and northern Mesopotamia.</desc>
  <defs>
    <radialGradient id="paperGlow" cx="48%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#f7edd8"/>
      <stop offset="62%" stop-color="#e7d8bd"/>
      <stop offset="100%" stop-color="#cdbd9f"/>
    </radialGradient>
    <linearGradient id="terrain" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7c9ae"/>
      <stop offset="48%" stop-color="#efe1c6"/>
      <stop offset="100%" stop-color="#b8c0ad"/>
    </linearGradient>
    <linearGradient id="zazaArea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#b88968" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#c89a76" stop-opacity=".72"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <mask id="fadeMask">
      <rect width="960" height="620" fill="url(#fade)"/>
    </mask>
    <radialGradient id="fade" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="70%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
    <style>
      .country { fill: url(#terrain); stroke: #9f927c; stroke-width: 1.4; }
      .border { fill: none; stroke: #847966; stroke-width: 2.2; stroke-dasharray: 8 9; opacity: .52; }
      .river { fill: none; stroke: #8ca2a4; stroke-width: 3; opacity: .62; }
      .road { fill: none; stroke: #bda986; stroke-width: 1.2; opacity: .52; }
      .range { fill: none; stroke: #afa07f; stroke-width: 1.1; opacity: .45; }
      .area { fill: url(#zazaArea); stroke: #8a593d; stroke-width: 2.6; opacity: .86; }
      .areaSoft { fill: #bd8767; opacity: .35; filter: url(#softBlur); }
      .dot { fill: #17362c; stroke: #f5e7ca; stroke-width: 2.6; }
      .dotMajor { fill: #8d5d3f; stroke: #f6e7c9; stroke-width: 3; }
      text { font-family: "Cormorant Garamond", Georgia, serif; fill: #5f5443; font-weight: 700; }
      .label { font-size: 32px; fill: #534735; }
      .small { font-size: 25px; fill: #665743; font-weight: 700; }
      .region { font-size: 20px; fill: #8b684b; font-family: Inter, Arial, sans-serif; font-weight: 800; letter-spacing: .04em; }
      .caption { font-size: 24px; fill: #7c563c; font-family: Inter, Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <rect width="960" height="620" fill="url(#paperGlow)"/>
  <g filter="url(#paperNoise)">
    <path class="country" d="M91 154 180 76l150-38 126 54 110-43 175 60 99 103-48 117 66 97-101 84-173 44-132-42-156 54-149-72-90-151Z"/>
    <path class="country" opacity=".72" d="M52 396 167 349l144 17 91 83-42 96-182 27-110-55Z"/>
    <path class="country" opacity=".6" d="M761 130 890 109l42 107-45 108-95-7-52-86Z"/>
    <path class="country" opacity=".58" d="M622 487 758 448l122 54-50 85-168 5Z"/>

    <path class="border" d="M78 373c119-47 207-54 264-22 72 41 148 43 230 5 90-42 177-36 260 17"/>
    <path class="river" d="M162 211c82 35 168 47 258 36 105-13 201 8 287 63"/>
    <path class="river" d="M311 413c72-39 144-50 217-31 52 14 97 7 136-20"/>

    <path class="road" d="M170 320c69-43 143-65 221-67 84-2 160-27 229-75"/>
    <path class="road" d="M209 408c82-38 158-54 229-48 95 9 176-13 243-65"/>
    <path class="road" d="M285 176c42 65 58 133 48 204"/>
    <path class="road" d="M523 139c-24 71-24 143 1 217"/>

    <g opacity=".78">
      <path class="range" d="M137 131c40 35 81 36 124 3s84-35 123-6 82 28 130-5"/>
      <path class="range" d="M184 181c51 26 101 22 151-12 52-35 103-39 153-13"/>
      <path class="range" d="M544 133c47 39 89 43 127 13 37-30 77-26 119 11"/>
      <path class="range" d="M121 469c58-26 111-24 158 5 53 32 103 29 151-9"/>
      <path class="range" d="M447 463c58-20 112-14 162 19 45 30 92 32 142 5"/>
    </g>

    <path class="areaSoft" d="M227 267 302 206l105-32 95 25 70-30 92 57 34 91-68 74-113 31-99-15-104 40-93-51-42-75Z"/>
    <path class="area" d="M231 271 303 214l105-33 93 25 70-31 87 55 31 84-62 69-112 31-98-14-101 39-89-48-39-72Z"/>
  </g>

  <g>
    <text class="small" x="132" y="118">Sivas</text>
    <circle class="dot" cx="196" cy="128" r="6"/>

    <text class="small" x="257" y="166">Erzincan</text>
    <circle class="dotMajor" cx="363" cy="158" r="7"/>

    <text class="label" x="349" y="269">Dersim</text>
    <text class="small" x="371" y="294">Tunceli</text>
    <circle class="dotMajor" cx="337" cy="278" r="8"/>

    <text class="small" x="300" y="342">Palu</text>
    <circle class="dot" cx="356" cy="337" r="6"/>

    <text class="small" x="416" y="333">Bingöl</text>
    <circle class="dotMajor" cx="499" cy="326" r="7"/>

    <text class="small" x="511" y="259">Kiğı</text>
    <circle class="dot" cx="557" cy="254" r="6"/>

    <text class="small" x="555" y="349">Genç</text>
    <circle class="dot" cx="613" cy="343" r="6"/>

    <text class="small" x="607" y="237">Varto</text>
    <circle class="dot" cx="674" cy="231" r="6"/>

    <text class="small" x="682" y="284">Muş</text>
    <circle class="dot" cx="733" cy="278" r="6"/>

    <text class="small" x="197" y="379">Elazığ</text>
    <circle class="dotMajor" cx="279" cy="373" r="7"/>

    <text class="small" x="122" y="420">Malatya</text>
    <circle class="dot" cx="210" cy="414" r="6"/>

    <text class="small" x="373" y="451">Diyarbakır</text>
    <circle class="dotMajor" cx="491" cy="445" r="7"/>

    <text class="small" x="531" y="470">Çermik</text>
    <circle class="dot" cx="617" cy="464" r="6"/>

    <text class="small" x="438" y="505">Siverek</text>
    <circle class="dotMajor" cx="533" cy="499" r="7"/>

    <text class="small" x="641" y="424">Ergani</text>
    <circle class="dot" cx="722" cy="418" r="6"/>
  </g>

  <g opacity=".74">
    <text class="region" x="374" y="119">EASTERN ANATOLIA</text>
    <text class="region" x="498" y="566">NORTHERN MESOPOTAMIA</text>
    <text class="caption" x="40" y="580">Zaza-Dimli speaking region and cultural centers</text>
  </g>

  <rect x="0" y="0" width="960" height="620" fill="none" stroke="#d9caaa" stroke-width="18" opacity=".32"/>
  <rect x="18" y="18" width="924" height="584" fill="none" stroke="#fff5df" stroke-width="2" opacity=".5"/>
  <rect width="960" height="620" fill="url(#paperGlow)" opacity=".12" mask="url(#fadeMask)"/>
</svg>
